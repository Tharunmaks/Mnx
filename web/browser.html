<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <title>Browser · Mnx Hive</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mnx.css">
</head>
<body>
<div class="app">
  <main class="main">
    <header class="topbar">
      <a class="icon-btn" href="index.html" aria-label="Back to chat"><span data-icon="back"></span></a>
      <h1>Browser Bee</h1>
      <label class="check live-toggle"><input type="checkbox" id="live" checked> Live</label>
      <span class="conn" id="conn"><i></i><span>Connecting</span></span>
    </header>

    <div class="scroll">
      <div class="page wide">
        <form class="urlbar" id="urlForm">
          <button type="button" class="icon-btn" id="bBack" aria-label="Back"><span data-icon="back"></span></button>
          <button type="button" class="icon-btn" id="bFwd" aria-label="Forward"><span data-icon="fwd"></span></button>
          <button type="button" class="icon-btn" id="bReload" aria-label="Reload"><span data-icon="refresh"></span></button>
          <input id="url" class="input" placeholder="Type a website, e.g. wikipedia.org" inputmode="url" autocomplete="off" enterkeyhint="go">
          <button class="btn primary" type="submit">Go</button>
        </form>

        <div class="browser-grid">
          <div>
            <div class="screen-frame" id="frame">
              <img id="shot" alt="Live view of the Browser Bee" class="hidden">
              <div class="screen-empty" id="empty">
                <p>This Bee's own Chromium, with its own saved cookies and logins. Open any site, then click on the picture to click the page.</p>
              </div>
              <div class="screen-busy hidden" id="busy"><span class="pulse"><span data-icon="hex"></span><span data-icon="hex"></span><span data-icon="hex"></span></span></div>
            </div>
            <p class="hint" id="title">&nbsp;</p>
            <form class="typebar" id="typeForm">
              <input id="typeText" class="input" placeholder="Type into the focused field…" autocomplete="off">
              <button class="btn" type="submit">Type</button>
              <button class="btn" type="button" data-key="Enter">Enter</button>
              <button class="btn" type="button" data-key="Tab">Tab</button>
              <button class="btn" type="button" data-key="Backspace">⌫</button>
              <button class="btn" type="button" data-scroll="-600">↑</button>
              <button class="btn" type="button" data-scroll="600">↓</button>
            </form>
            <p class="hint err" id="err"></p>
          </div>

          <aside class="side-panel">
            <div class="tabs" role="tablist">
              <button class="tab active" data-tab="elements" type="button">What it sees</button>
              <button class="tab" data-tab="text" type="button">Page text</button>
            </div>
            <div id="tab-elements" class="tab-body"><p class="hint">Clickable things on the page show up here.</p></div>
            <div id="tab-text" class="tab-body hidden"><pre class="result-box" id="pageText">Press "Page text" to read the page.</pre></div>
            <button class="btn danger" type="button" id="closeBrowser">Close browser</button>
          </aside>
        </div>
      </div>
    </div>
  </main>
</div>
<script type="module" src="js/browser.js"></script>
</body>
</html>
