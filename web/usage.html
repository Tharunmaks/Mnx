<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <title>Usage · Mnx Hive</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mnx.css">
</head>
<body>
<div class="app">
  <main class="main">
    <header class="topbar">
      <a class="icon-btn" href="index.html" aria-label="Back to chat"><span data-icon="back"></span></a>
      <h1>Usage and limits</h1>
      <span class="conn" id="conn"><i></i><span>Connecting</span></span>
    </header>

    <div class="scroll">
      <div class="page" id="page">
        <p class="hint" id="stamp">Loading what the Hive has used…</p>

        <div class="section-title"><h2>Tokens</h2><span class="hint" id="tokNote"></span></div>
        <div class="stats" id="tokStats"></div>
        <div class="usage-card">
          <div class="usage-head"><b>Last 14 days</b>
            <button class="btn" id="viewToggle" type="button">Table</button></div>
          <div id="tokChart"></div>
        </div>
        <div class="usage-card" style="margin-top:12px">
          <div class="usage-head"><b>Limit per message, by effort level</b><span class="hint">today</span></div>
          <div class="utable" id="effortTable"></div>
        </div>

        <div class="section-title"><h2>This server</h2><span class="hint" id="serverNote"></span></div>
        <div class="usage-card" id="serverMeters"></div>

        <div class="section-title"><h2>Bees</h2><span class="hint" id="beeNote"></span></div>
        <div class="stats" id="beeStats"></div>
        <div class="usage-card"><div class="utable" id="beeTable"></div></div>

        <div class="section-title"><h2>Training and models</h2></div>
        <div class="stats" id="labStats"></div>

        <div class="section-title"><h2>Rented GPUs</h2></div>
        <div class="usage-card" id="rentals"></div>

        <div class="section-title"><h2>Limits</h2></div>
        <div class="usage-card" id="limits"></div>
      </div>
    </div>
  </main>
</div>
<script type="module" src="js/usage.js"></script>
</body>
</html>
