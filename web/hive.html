<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <title>Hive · Mnx Hive</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mnx.css">
</head>
<body>
<div class="app">
  <main class="main">
    <header class="topbar">
      <a class="icon-btn" href="index.html" aria-label="Back to chat"><span data-icon="back"></span></a>
      <h1>Hive</h1>
      <span class="conn" id="conn"><i></i><span>Connecting</span></span>
    </header>

    <div class="scroll">
      <div class="page">
        <div class="stats">
          <div class="stat"><div class="n" id="nBusy">0</div><div class="l"><span class="status busy"></span>Busy</div></div>
          <div class="stat"><div class="n" id="nIdle">0</div><div class="l"><span class="status idle"></span>Idle</div></div>
          <div class="stat"><div class="n" id="nScheduled">0</div><div class="l"><span class="status scheduled"></span>Scheduled</div></div>
          <div class="stat"><div class="n" id="nFailed">0</div><div class="l"><span class="status failed"></span>Failed</div></div>
        </div>

        <div class="section-title"><h2>Bees</h2><button class="btn primary" id="addBeeTop">Add Bee</button></div>
        <div class="bee-grid" id="beeGrid"></div>

        <div class="section-title"><h2>Activity log</h2><button class="btn" id="refreshLog">Refresh</button></div>
        <div class="log" id="log"></div>
      </div>
    </div>
  </main>
</div>

<dialog id="beeDlg">
  <form method="dialog" id="beeForm">
    <div class="dlg-head"><h2>Add a Bee</h2><button class="icon-btn" value="cancel" aria-label="Close"><span data-icon="close"></span></button></div>
    <div class="dlg-body">
      <p class="hint">A Bee's card: its name, one-line skill, the tools it may use and whether it needs your OK. The Queen reads these cards when planning.</p>
      <label class="field">Name
        <input name="name" required maxlength="24" placeholder="e.g. Notes">
      </label>
      <label class="field">Skill (one line)
        <input name="skill" required maxlength="90" placeholder="What this Bee does">
      </label>
      <label class="field">Tools (comma separated)
        <input name="tools" maxlength="200" placeholder="e.g. web_search, read_page">
      </label>
      <label class="field">Schedule (cron, optional)
        <input name="schedule" maxlength="40" placeholder="e.g. 0 8 * * *">
      </label>
      <label class="check"><input type="checkbox" name="approval" checked> Ask me before it acts (Ask lane)</label>
      <p class="hint" id="beeErr" style="color:var(--failed)"></p>
    </div>
    <div class="dlg-foot">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="save">Add Bee</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/hive.js"></script>
</body>
</html>
